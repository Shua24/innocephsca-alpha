[buildPlans.InnocephscaAlpha]
family = "Innocephsca Alpha"
spacing = "normal"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

[buildPlans.InnocephscaAlpha.variants.design]
a = "single-storey-earless-corner-serifed"
f = "tailed-crossbar-at-half-ascender-height"
l = "serifed-semi-tailed"
x = "straight-unilateral-motion-serifed"
capital-eszet = "flat-top-serifed"
long-s = "bent-hook-tailed-middle-serifed-half-ascender"
eszet = "sulzbacher-tailed-serifless"
lower-iota = "serifed-semi-tailed"
lower-lambda = "curly-tailed-turn"
lower-tau = "semi-tailed"
partial-derivative = "closed-contour"
cyrl-a = "single-storey-serifed"

[buildPlans.InnocephscaAlpha.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.InnocephscaAlpha.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.InnocephscaAlpha.widths.Condensed]
shape = 500
menu = 3
css = "condensed"

[buildPlans.InnocephscaAlpha.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.InnocephscaAlpha.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.InnocephscaAlpha.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

